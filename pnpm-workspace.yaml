packages:
  - frontend
  - backend
  - mobile

catalog:
  '@typescript/native': npm:typescript@7.0.2
  typescript: 6.0.3

packageConfigs:
  '@clienthub/frontend':
    saveExact: true
  '@clienthub/mobile':
    saveExact: true

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  '@react-native/dev-middleware>ws': 7.5.11
  brace-expansion@5: 5.0.12
  fast-uri: 3.1.9
  lightningcss: 1.30.1
  'metro>ws': 7.5.11
  postcss: 8.5.30
  'react-devtools-core>ws': 7.5.11
  'react-native>ws': 7.5.11
  shell-quote: 1.11.0
  # Correctifs transitifs en attendant leur adoption par les dépendances parentes.
  '@graphql-tools/utils@>=10 <12.0.2': 12.1.0
  '@xmldom/xmldom@0.8': 0.8.15
  baseline-browser-mapping: 2.11.0
  browserslist: 4.28.7
  decode-uri-component: 0.5.1
  glob: 14.0.2
  minimatch: 11.0.1
  postcss-selector-parser: 7.1.6
  tinypool: 2.1.2
  # Expo CLI uses APIs shared by Zod 3 and 4; covered by test:security.
  '@expo/cli>zod': 4.6.7
packageExtensions:
  '@react-native-google-signin/google-signin@*':
    dependencies:
      '@expo/config-plugins': '*'
# GHSA-gcqx-w48m-w2h4: no patched release is published upstream.
# Define own properties instead of invoking prototype setters; tested by test:security.
# Remove this patch when deepmerge publishes a verified upstream fix.
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
